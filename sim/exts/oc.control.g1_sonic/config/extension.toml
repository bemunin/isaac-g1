[package]
version = "0.2.0"
title = "G1 SONIC"
description = "Moves a Unitree G1 with NVIDIA SONIC whole-body control: real-time commands."
keywords = ["control", "g1_sonic", "sonic", "whole-body"]
authors = ["bemunin <tw.munin@gmail.com>"]
readme = "docs/README.md"
changelog = "docs/CHANGELOG.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[core]
reloadable = true

[dependencies]
"isaacsim.core.experimental.prims" = {}
"isaacsim.core.simulation_manager" = {}
"isaacsim.robot.policy.examples" = {}
"isaacsim.robot_motion.experimental.motion_generation" = {}
"isaacsim.sensors.experimental.physics" = {}
"omni.timeline" = {}
"omni.usd" = {}

[[python.module]]
name = "oc.control.g1_sonic"

[[python.module]]
name = "oc.control.g1_sonic.tests"

[[test]]
dependencies = ["omni.kit.test"]
