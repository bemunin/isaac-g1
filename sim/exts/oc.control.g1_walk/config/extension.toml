[package]
version = "0.3.0"
title = "G1 Walk"
description = "G1 Walk extension."
keywords = ["control", "g1_walk"]
authors = ["bemunin <tw.munin@gmail.com>"]
readme = "docs/README.md"
changelog = "docs/CHANGELOG.md"

[core]
reloadable = true

[dependencies]
"isaacsim.core.experimental.prims" = {}
"isaacsim.core.simulation_manager" = {}
"isaacsim.gui.components" = {}
"isaacsim.robot.policy.examples" = {}
"isaacsim.robot_motion.experimental.motion_generation" = {}
"isaacsim.sensors.experimental.physics" = {}
"isaacsim.util.debug_draw" = {}
"omni.kit.actions.core" = {}
"omni.kit.menu.utils" = {}
"omni.timeline" = {}
"omni.ui" = {}
"omni.usd" = {}

[[python.module]]
name = "oc.control.g1_walk"

[[python.module]]
name = "oc.control.g1_walk.tests"

[[test]]
dependencies = ["omni.kit.test"]
