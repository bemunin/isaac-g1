[package]
version = "0.3.0"
title = "Warehouse"
description = "Warehouse extension."
keywords = ["scenario", "warehouse"]
authors = ["bemunin <tw.munin@gmail.com>"]
repository = "https://github.com/bemunin/isaac-g1"
readme = "docs/README.md"
changelog = "docs/CHANGELOG.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[core]
reloadable = true

[dependencies]
"isaacsim.core.experimental.utils" = {}
"isaacsim.core.simulation_manager" = {}
"oc.control.g1_sonic" = {}
"oc.robot.g1" = {}
"omni.ui" = {}

[settings]
# Open the warehouse once the app is ready.
exts."oc.scenario.warehouse".autostart = false
# Play the simulation once the Scenario opens (with autostart); off leaves it stopped.
exts."oc.scenario.warehouse".autoplay = false
# Publish the G1's ROS 2 topics (camera, lidar, TF, IMU, joint states, odometry); off deactivates /World/G1/Graph.
exts."oc.scenario.warehouse".ros = false
# Props to show, comma-separated: "clutter" (boxes, crates, cones, signs) and/or "forklift"; empty shows none.
exts."oc.scenario.warehouse".obstacles = ""
# Drive the G1 with SONIC from the physics callback; off leaves it unpowered.
exts."oc.scenario.warehouse".sonic = true

[[python.module]]
name = "oc.scenario.warehouse"

[[python.module]]
name = "oc.scenario.warehouse.tests"

[[test]]
dependencies = ["omni.kit.test"]
