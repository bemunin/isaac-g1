[workspace]
authors = ["bemunin <tw.munin@gmail.com>"]
channels = ["conda-forge", "https://prefix.dev/robostack-jazzy"]
name = "isaac-g1"
platforms = [{ platform = "linux-64", glibc = "2.35" }, "win-64"]
version = "0.1.0"

[tasks]
dds = { cmd = "python scripts/dds.py", description = "Show or select the DDS for new Pixi sessions" }
shell = { cmd = "pixi shell", cwd = "ros_ws", description = "Open a ROS 2 shell in ros_ws" }
zenoh = "ros2 run rmw_zenoh_cpp rmw_zenohd"
build = { cmd = "colcon build --symlink-install --merge-install", cwd = "ros_ws", description = "Build the ROS 2 packages in ros_ws" }
lint = "ruff check ."
sonic-download = { cmd = "python scripts/sonic_download.py", description = "Download NVIDIA's default SONIC weights for oc.control.g1_wbc_sonic (~865 MB)" }

[target.linux-64.tasks]
foxglove = { cmd = "ros2 launch oc_foxglove_bridge foxglove_bridge.launch.py", env = { AMENT_PREFIX_PATH = "$PIXI_PROJECT_ROOT/ros_ws/install:$AMENT_PREFIX_PATH" }, description = "Start the Foxglove WebSocket bridge with the G1 robot description on sim time (ws://localhost:8765); run build first" }

[target.win-64.tasks]
foxglove = { cmd = "ros2 launch oc_foxglove_bridge foxglove_bridge.launch.py", env = { AMENT_PREFIX_PATH = "$PIXI_PROJECT_ROOT/ros_ws/install;$AMENT_PREFIX_PATH" }, description = "Start the Foxglove WebSocket bridge with the G1 robot description on sim time (ws://localhost:8765); run build first" }

[target.linux-64.activation]
scripts = ["scripts/dds/activate.sh"]

[target.win-64.activation]
scripts = ["scripts/dds/activate.bat"]

[dependencies]
python = "3.12.*"
ruff = "==0.16.9"
ros-jazzy-desktop = "*"
ros-jazzy-rmw-fastrtps-cpp = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-rmw-zenoh-cpp = "*"
ros-jazzy-foxglove-bridge = "*"
colcon-common-extensions = ">=0.3.0,<0.4"

[feature.sim.dependencies]
python = "3.12.*"

[feature.sim.target.linux-64.activation]
scripts = ["scripts/dds/activate.sh"]

[feature.sim.target.win-64.activation]
scripts = ["scripts/dds/activate.bat"]

[feature.sim.pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]
index-strategy = "unsafe-best-match"
prerelease-mode = "allow"

[feature.sim.pypi-dependencies]
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu128" }
isaacsim = { version = "==6.1.0.0", extras = ["all", "extscache", "ros2"] }

[feature.sim.tasks]
sim = "python scripts/sim.py"
warehouse = { cmd = "python scripts/warehouse.py", description = "Open the warehouse Scenario and play it: [--workflow standalone|ext] [--physics newton|physx] [--dds fast|cyclone|zenoh] [--controller walk|wbc] [--ros] [--headless]" }
benchmark = { cmd = "python scripts/benchmark.py", description = "Run a benchmark: --name dds [--workflow ext|standalone] [--physics newton|physx] [--dds fast|cyclone|zenoh] [--headless]" }

[environments]
default = { features = [] }
sim = { features = ["sim"], no-default-feature = true }
